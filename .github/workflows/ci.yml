name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ruff
        run: pip install ruff
      - name: Verificar estilo del codigo
        run: ruff check app/

  construir:
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
      - name: Construir la imagen Docker
        run: docker build -t api-ia:ci .

  pruebas:
    runs-on: ubuntu-latest
    needs: calidad
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: clasificador_db
          POSTGRES_PASSWORD: password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: clasificador_db
      DB_USER: postgres
      DB_PASSWORD: password
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias y cliente PostgreSQL
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          pip install -r requirements.txt pytest httpx
      - name: Inicializar base de datos
        run: psql -h localhost -U postgres -d clasificador_db -f db/init.sql
        env:
          PGPASSWORD: password
      - name: Ejecutar pruebas automatizadas
        run: python -m pytest -v
